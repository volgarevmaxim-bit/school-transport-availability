# ФИКСИРОВАННЫЕ ПАРАМЕТРЫ (ТЗ v2 §ФИКСИРОВАННЫЕ ПАРАМЕТРЫ). Правки — только с пометкой в log.md.
date: '2026-10-14'      # среда; учебный день по четвертной И модульной системам (окна: 12–23.10, 05–13.11).
                        # При старте Стадии 2 позже 14.10 — сдвинуть на ближайший вт–чт в окне.
msk_arrival: '08:30'    # ориентир прибытия к школе; МСК = UTC+3

car:                    # гипотеза семантики start_time проверяется в Стадии 2
  20: {start_time_utc: '05:10Z'}   # выезд 8:10
  40: {start_time_utc: '04:50Z'}   # выезд 7:50

pt:
  start_time_utc: '05:30Z'         # 8:30 МСК
  public_transport_types: null     # сначала без параметра; затем ['metro'], ['metro','mcc','mcd']

durations_sec: [1200, 2400]        # лимит API: до 5 значений, каждое ≤ 3600 с

budget:
  limit_per_service: 1000          # общий запас демо-ключа (не приоритетен; реальные лимиты ниже)
  reserve: 100

# Суточные лимиты демо-ключа (решение владельца 08.10; сброс — по UTC-суткам, Platform Manager).
# routing_api: маршруты + ОТ делят ОДИН счётчик «Routing API» (подтверждено: 50/день).
# matrix/изохроны/геокодер/static — отдельные счётчики (50/день — предположение для matrix/iso,
# запас обязателен). Клиент останавливается заранее (лимит − reserve) и без повторов на 429.
daily_limits:
  routing_api: {limit: 50, reserve: 5}
  matrix:      {limit: 50, reserve: 5}
  isochrone:   {limit: 50, reserve: 5}
  geocoder:    {limit: 50, reserve: 5}
  static_maps: {limit: 50, reserve: 5}

lobes:                              # параметры детекции лепестков (Стадия 6, подбор)
  k_mad: 3
  smooth_w: 3                       # сглаживание профиля скользящим средним по секторам
  min_sectors: 2                    # минимум секторов (×5°) в лепестке
  gap_sectors: 1                    # допуск разрыва между секторами лепестка
  buffer_d_m: null
  sector_deg: 5

method_version: 'v1'
